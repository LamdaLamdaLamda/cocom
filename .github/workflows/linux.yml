name: Linux

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    name: Build & test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      - name: Build (debug)
        run: just build-dev

      - name: Build (release)
        run: just build

      - name: Run test suite
        run: just test

      - name: Smoke-test debug binary
        run: just run-dev

      - name: Smoke-test release binary
        run: just run

      - name: Verify --apply fails cleanly without elevated privileges
        run: |
          set +e
          output=$(./target/release/cocom -o --apply pool.ntp.org 2>&1)
          exit_code=$?
          set -e

          echo "$output"

          if [ "$exit_code" -eq 0 ]; then
            echo "ERROR: expected --apply to fail without elevated privileges, but it succeeded"
            exit 1
          fi

          if ! echo "$output" | grep -qi "not permitted"; then
            echo "ERROR: --apply failed, but not for the expected permission reason"
            exit 1
          fi

          echo "OK: --apply correctly refused to run without elevated privileges"

      # Must stay the last step: this actually steps the runner's system clock via sudo.
      # A hard step could disrupt any subsequent network/TLS-dependent step (cert validity
      # checks, job log/artifact upload) if it ran earlier in the job.
      - name: Apply a real clock correction with sudo (last step)
        run: |
          echo "Clock before: $(date -u)"
          sudo ./target/release/cocom -o --apply pool.ntp.org
          echo "Clock after:  $(date -u)"
