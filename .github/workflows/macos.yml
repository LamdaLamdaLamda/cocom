name: macOS

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    name: Build & test

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      - name: Build (debug)
        run: just build-dev

      - name: Build (release)
        run: just build

      - name: Run test suite
        run: just test

      - name: Smoke-test debug binary
        run: just run-dev

      - name: Smoke-test release binary
        run: just run

      - name: Verify --apply fails cleanly without elevated privileges
        run: |
          set +e
          output=$(./target/release/cocom -o --apply 2>&1)
          exit_code=$?
          set -e

          echo "$output"

          if [ "$exit_code" -eq 0 ]; then
            if echo "$output" | grep -qi "not applying"; then
              echo "OK: measured offset was below the step threshold, so no privileged syscall was attempted (nothing to verify here)"
            else
              echo "ERROR: expected --apply to fail without elevated privileges, but it stepped the clock"
              exit 1
            fi
          elif echo "$output" | grep -qi "not permitted"; then
            echo "OK: --apply correctly refused to run without elevated privileges"
          elif echo "$output" | grep -qiE "temporarily unavailable|timed out|timeout|network is unreachable|no route to host"; then
            echo "WARNING: could not reach the NTP server from this CI runner (pre-existing network flakiness, see CHANGELOG). Skipping this check rather than failing the build."
          else
            echo "ERROR: --apply failed, but not for the expected permission reason"
            exit 1
          fi

      # Must stay the last step: this actually steps the runner's system clock via sudo.
      # A hard step could disrupt any subsequent network/TLS-dependent step (cert validity
      # checks, job log/artifact upload) if it ran earlier in the job.
      - name: Apply a real clock correction with sudo (last step)
        run: |
          echo "Clock before: $(date -u)"

          set +e
          output=$(sudo ./target/release/cocom -o --apply 2>&1)
          exit_code=$?
          set -e

          echo "$output"
          echo "Clock after:  $(date -u)"

          if [ "$exit_code" -ne 0 ]; then
            if echo "$output" | grep -qiE "temporarily unavailable|timed out|timeout|network is unreachable|no route to host"; then
              echo "WARNING: could not reach the NTP server from this CI runner (pre-existing network flakiness, see CHANGELOG). Skipping this check rather than failing the build."
            else
              echo "ERROR: sudo --apply failed for an unexpected reason"
              exit 1
            fi
          fi
